name: Add Cianova news

on:
  workflow_dispatch:
    inputs:
      title_es:
        description: "Título (español)"
        required: true
        type: string
      summary_es:
        description: "Resumen breve (español)"
        required: true
        type: string
      title_en:
        description: "Título (inglés, opcional)"
        required: false
        type: string
      summary_en:
        description: "Resumen breve (inglés, opcional)"
        required: false
        type: string
      body:
        description: "Cuerpo Markdown (opcional)"
        required: false
        type: string
      image:
        description: "URL de imagen https (opcional)"
        required: false
        type: string
      url:
        description: "Enlace externo (opcional)"
        required: false
        type: string
      published:
        description: "Fecha YYYY-MM-DD (vacío = hoy)"
        required: false
        type: string
      id:
        description: "ID/slug (vacío = derivado del título)"
        required: false
        type: string

concurrency:
  group: cianova-news-add
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create document
        env:
          TITLE_ES: ${{ inputs.title_es }}
          TITLE_EN: ${{ inputs.title_en }}
          SUMMARY_ES: ${{ inputs.summary_es }}
          SUMMARY_EN: ${{ inputs.summary_en }}
          BODY: ${{ inputs.body }}
          IMAGE: ${{ inputs.image }}
          URL: ${{ inputs.url }}
          PUBLISHED: ${{ inputs.published }}
          NEWS_ID: ${{ inputs.id }}
        run: |
          python scripts/add_cianova_news.py \
            --title-es "$TITLE_ES" \
            --summary-es "$SUMMARY_ES" \
            --title-en "$TITLE_EN" \
            --summary-en "$SUMMARY_EN" \
            --body "$BODY" \
            --image "$IMAGE" \
            --url "$URL" \
            --published "${PUBLISHED:-$(date -u +%F)}" \
            --id "$NEWS_ID"

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit changes
        run: |
          if git diff --quiet -- news news.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "cianova-news-bot"
          git config user.email "bot@cianovalauncher.org"
          git add news news.json
          git commit -m "feat(news): nueva noticia de Cianova"
          git push
