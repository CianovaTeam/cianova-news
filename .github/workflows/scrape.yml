name: Scrape Minecraft news

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: cianova-news-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import new Bedrock versions
        run: python scripts/scrape_minecraft.py --limit 10

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit changes
        run: |
          if git diff --quiet -- news news.json; then
            echo "Sin noticias nuevas."
            exit 0
          fi
          git config user.name "cianova-news-bot"
          git config user.email "bot@cianovalauncher.org"
          git add news news.json
          git commit -m "chore(news): importar noticias de Minecraft"
          git push
