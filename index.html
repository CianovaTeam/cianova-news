<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cianova News</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#16181d; --muted:#5c6270; --card:#fff; --line:#e3e6eb; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141a; --fg:#e9ecf2; --muted:#9aa2b1; --card:#1a1d25; --line:#2a2f3a; --accent:#6f9bff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { max-width:860px; margin:0 auto; padding:48px 20px 8px; }
  h1 { margin:0 0 6px; font-size:1.9rem; letter-spacing:-.02em; }
  header p { margin:0; color:var(--muted); }
  main { max-width:860px; margin:0 auto; padding:20px; display:grid; gap:14px; }
  a.card { display:grid; grid-template-columns:120px 1fr; gap:16px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; text-decoration:none; color:inherit; }
  a.card:hover { border-color:var(--accent); }
  a.card img, .thumb { width:120px; height:74px; object-fit:cover; border-radius:9px; background:var(--line); }
  .body h2 { margin:2px 0 6px; font-size:1.05rem; }
  .body p { margin:0 0 8px; color:var(--muted); font-size:.92rem; }
  .meta { display:flex; gap:8px; align-items:center; font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .badge { padding:2px 7px; border:1px solid var(--line); border-radius:999px; }
  footer { max-width:860px; margin:0 auto; padding:24px 20px 56px; color:var(--muted); font-size:.82rem; }
  @media (max-width:560px) { a.card { grid-template-columns:1fr; } a.card img, .thumb { width:100%; height:140px; } }
</style>
</head>
<body>
<header>
  <h1>Cianova News</h1>
  <p>Noticias de CianovaLauncher y de Minecraft Bedrock.</p>
</header>
<main id="feed"><p>Cargando noticias…</p></main>
<footer>
  Índice: <a href="news.json">news.json</a> · Resúmenes de Minecraft basados en
  <a href="https://es.minecraft.wiki/">Minecraft Wiki</a> (CC BY-NC-SA 3.0).
  Minecraft es una marca de Mojang Studios.
</footer>
<script>
fetch("news.json", { cache: "no-cache" })
  .then((response) => response.json())
  .then((data) => {
    const feed = document.getElementById("feed");
    const items = (data.items || []).slice(0, 20);
    if (!items.length) { feed.innerHTML = "<p>Sin noticias por ahora.</p>"; return; }
    feed.innerHTML = "";
    for (const item of items) {
      const title = (item.title && (item.title.es || item.title.en)) || item.id;
      const summary = (item.summary && (item.summary.es || item.summary.en)) || "";
      const href = item.url || item.doc;
      const card = document.createElement("a");
      card.className = "card";
      card.href = href;
      card.rel = "noopener";
      const thumb = item.image
        ? `<img src="${item.image}" alt="" loading="lazy" referrerpolicy="no-referrer">`
        : `<div class="thumb"></div>`;
      card.innerHTML = `${thumb}<div class="body">
        <div class="meta"><span class="badge">${item.type === "cianova" ? "Cianova" : "Minecraft"}</span><span>${item.published || ""}</span></div>
        <h2></h2><p></p></div>`;
      card.querySelector("h2").textContent = title;
      card.querySelector("p").textContent = summary;
      feed.appendChild(card);
    }
  })
  .catch(() => { document.getElementById("feed").innerHTML = "<p>No se pudo cargar el índice.</p>"; });
</script>
</body>
</html>
